name: Build APK from ZIP

on:
  workflow_dispatch:
    inputs:
      zip_file:
        description: "ZIP file in repository root (normally input.zip)"
        required: true
        default: "input.zip"
  push:
    paths:
      - "input.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP exists
        id: zipcheck
        shell: bash
        run: |
          ZIP_FILE="${{ github.event.inputs.zip_file || 'input.zip' }}"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::ZIP file not found: $ZIP_FILE. Upload it to the repository root."
            exit 1
          fi
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project ZIP
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q "${{ steps.zipcheck.outputs.zip_file }}" -d extracted
          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          ROOT="$(find "$GITHUB_WORKSPACE/extracted" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)"
          if [ -z "$ROOT" ]; then
            echo "::error::No settings.gradle or settings.gradle.kts found in ZIP. This is not a Gradle Android project."
            exit 1
          fi
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Project root: $ROOT"

      - name: Set up Gradle (fallback if wrapper is absent)
        if: ${{ !hashFiles('extracted/**/gradlew') }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Collect APK files
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          find "$GITHUB_WORKSPACE/extracted" -type f -path "*/build/outputs/apk/*/*.apk" -exec cp {} "$GITHUB_WORKSPACE/apk-output/" \;
          if [ -z "$(find "$GITHUB_WORKSPACE/apk-output" -name '*.apk' -print -quit)" ]; then
            echo "::error::Build ran but no APK was found under build/outputs/apk."
            exit 1
          fi
          ls -lh "$GITHUB_WORKSPACE/apk-output"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 7
