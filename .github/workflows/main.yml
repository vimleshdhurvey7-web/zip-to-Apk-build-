name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' # Change to 11 or 8 if your project is older

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # IMPORTANT: Add working-directory here
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ./YOUR_PROJECT_FOLDER

      # IMPORTANT: Add working-directory here as well
      - name: Build Debug APK
        run: ./gradlew assembleDebug
        working-directory: ./YOUR_PROJECT_FOLDER

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          # IMPORTANT: Update the path to include your folder name
          files: YOUR_PROJECT_FOLDER/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
